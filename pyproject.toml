[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-detect"
version = "0.4"
description = "Small utility to detect devices on local network"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "CZ.NIC, z.s.p.o. (http://www.nic.cz/)", email = "packaging@turris.cz"}]
requires-python = ">=3.9"
dependencies = [
    "pyroute2",
    "pyuci",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://gitlab.nic.cz/turris/dev-detect"

[project.scripts]
dev-detect-daemon = "dev_detect.__main__:main"
dev-detect = "dev_detect.cli:main"

[tool.setuptools]
packages = ["dev_detect"]
